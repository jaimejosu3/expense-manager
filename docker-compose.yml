version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      # Node
      - NODE_ENV=development
      - PORT=3000

      # Database
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USERNAME=user
      - DB_PASSWORD=password
      - DB_DATABASE=expense_tracker

      # JWT
      - JWT_SECRET=your-super-secret-key-here
      - JWT_EXPIRATION=1d
    depends_on:
      - db
    command: npm run start:dev
    networks:
      - expense-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - API_URL=http://localhost:3000/api
    command: npm start
    depends_on:
      - backend
    networks:
      - expense-network

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=expense_tracker
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - expense-network

volumes:
  mysql_data:


networks:
  expense-network:
    driver: bridge
