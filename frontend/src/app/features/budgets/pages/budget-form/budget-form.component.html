<div class="p-4">
    <h1 class="text-2xl font-bold mb-4">
        {{ isEditing ? 'Editar' : 'Nuevo' }} Presupuesto
    </h1>

    <form [formGroup]="budgetForm" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <mat-form-field>
                <mat-label>Nombre</mat-label>
                <input matInput formControlName="name">
            </mat-form-field>

            <mat-form-field>
                <mat-label>Monto</mat-label>
                <input matInput type="number" formControlName="amount">
            </mat-form-field>

            <mat-form-field>
                <mat-label>Categoría</mat-label>
                <mat-select formControlName="categoryId">
                    @for (category of categories; track category.id) {
                    <mat-option [value]="category.id">
                        {{ category.name }}
                    </mat-option>
                    }
                </mat-select>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Fecha Inicio</mat-label>
                <input matInput [matDatepicker]="startPicker" formControlName="startDate">
                <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
                <mat-datepicker #startPicker></mat-datepicker>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Fecha Fin</mat-label>
                <input matInput [matDatepicker]="endPicker" formControlName="endDate">
                <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
                <mat-datepicker #endPicker></mat-datepicker>
            </mat-form-field>

            <div>
                <mat-slide-toggle formControlName="isRecurring">
                    Presupuesto Recurrente
                </mat-slide-toggle>
            </div>

            @if (budgetForm.get('isRecurring')?.value) {
            <mat-form-field>
                <mat-label>Tipo de Recurrencia</mat-label>
                <mat-select formControlName="recurrenceType">
                    <mat-option value="monthly">Mensual</mat-option>
                    <mat-option value="yearly">Anual</mat-option>
                </mat-select>
            </mat-form-field>
            }

            <mat-form-field class="col-span-2">
                <mat-label>Descripción</mat-label>
                <textarea matInput rows="3" formControlName="description"></textarea>
            </mat-form-field>
        </div>

        <div class="flex justify-end gap-2 mt-4">
            <button mat-button type="button" routerLink="../">Cancelar</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="budgetForm.invalid || loading">
                {{ isEditing ? 'Actualizar' : 'Crear' }}
            </button>
        </div>
    </form>
</div>
