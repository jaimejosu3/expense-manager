<div class="p-4">
    <h1 class="text-2xl font-bold mb-4">
        {{ isEditing ? 'Editar' : 'Nueva' }} Categoría
    </h1>

    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-1 gap-4 max-w-md">
            <mat-form-field>
                <mat-label>Nombre</mat-label>
                <input matInput formControlName="name">
                @if (categoryForm.get('name')?.hasError('required') &&
                categoryForm.get('name')?.touched) {
                <mat-error>El nombre es requerido</mat-error>
                }
            </mat-form-field>

            <mat-form-field>
                <mat-label>Descripción</mat-label>
                <textarea matInput formControlName="description" rows="3"></textarea>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Color</mat-label>
                <input matInput type="color" formControlName="color">
            </mat-form-field>

            <mat-form-field>
                <mat-label>Presupuesto</mat-label>
                <input matInput type="number" formControlName="budget">
            </mat-form-field>

            <div class="flex justify-end gap-2">
                <button mat-button type="button" routerLink="../">Cancelar</button>
                <button mat-raised-button color="primary" type="submit" [disabled]="categoryForm.invalid || loading">
                    {{ isEditing ? 'Actualizar' : 'Crear' }}
                </button>
            </div>
        </div>
    </form>
</div>
