<mat-card>
    <mat-card-header>
        <mat-card-title>Resumen de Gastos</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <div class="flex items-center justify-between p-4">
            <div>
                <p class="text-gray-600">Total Mensual</p>
                <h2 class="text-2xl font-bold">{{ totalExpenses | currency }}</h2>
            </div>
            <mat-icon [class.text-red-500]="trend < 0" [class.text-green-500]="trend > 0">
                {{ trend > 0 ? 'trending_up' : 'trending_down' }}
            </mat-icon>
        </div>
    </mat-card-content>
</mat-card>
