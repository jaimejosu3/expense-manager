<div class="p-4">
    <div class="flex justify-between items-center mb-4">
        <h1 class="text-2xl font-bold">Reportes y Análisis</h1>
    </div>

    <form [formGroup]="filterForm" class="mb-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <mat-form-field>
                <mat-label>Fecha Inicio</mat-label>
                <input matInput [matDatepicker]="startPicker" formControlName="startDate">
                <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
                <mat-datepicker #startPicker></mat-datepicker>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Fecha Fin</mat-label>
                <input matInput [matDatepicker]="endPicker" formControlName="endDate">
                <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
                <mat-datepicker #endPicker></mat-datepicker>
            </mat-form-field>

            <button mat-raised-button color="primary" (click)="applyFilters()">
                Aplicar Filtros
            </button>
        </div>
    </form>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-expense-chart [data]="monthlyData" type="line" title="Gastos Mensuales">
        </app-expense-chart>

        <app-expense-chart [data]="categoryData" type="pie" title="Gastos por Categoría">
        </app-expense-chart>

        <app-expense-chart [data]="trendData" type="bar" title="Tendencias">
        </app-expense-chart>

        <app-expense-chart [data]="budgetData" type="bar" title="Comparación con Presupuesto">
        </app-expense-chart>
    </div>
</div>
